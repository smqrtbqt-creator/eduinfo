# Aide & Services — démo cybersécurité
# Accessible en HTTPS sur le 443 (sans ouvrir le port 8444 chez OVH)
#
# Lien : https://164.132.108.166/cyber/

location = /cyber {
    return 301 /cyber/;
}

location /cyber/ {
    proxy_pass https://127.0.0.1:8444/;
    proxy_ssl_verify off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Nécessaire pour que sub_filter voie le HTML non compressé
    proxy_set_header Accept-Encoding "";

    # Réécrit les liens absolus du site (/static, /register, …) sous /cyber/
    sub_filter_types text/html;
    sub_filter_once off;
    sub_filter 'href="/' 'href="/cyber/';
    sub_filter 'src="/' 'src="/cyber/';
    sub_filter 'action="/' 'action="/cyber/';

    # Redirections FastAPI (303 Login, register, admin…)
    proxy_redirect / /cyber/;
}
