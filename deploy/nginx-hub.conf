# Catalogue des projets + routes associées
# À inclure dans le server 443 de waterstation (IP 164.132.108.166)

# Page d'accueil = catalogue
location = / {
    root /var/www/tp-info/eduinfo/eduinfo/deploy/hub;
    try_files /index.html =404;
}

# Assets du catalogue (CSS, JS, JSON)
location /hub/ {
    alias /var/www/tp-info/eduinfo/eduinfo/deploy/hub/;
}

# Waterstation (ex-page d'accueil) déplacé sous /waterstation/
# Note : si l'app SvelteKit casse les assets, il faudra configurer son base path.
location /waterstation/ {
    proxy_pass http://127.0.0.1:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}

# TP jeu TIM/PSC1
include /var/www/tp-info/eduinfo/eduinfo/deploy/nginx-jeu.conf;
