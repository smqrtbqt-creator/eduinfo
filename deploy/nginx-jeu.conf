# À inclure dans le serveur Nginx qui écoute déjà sur 443
# (sites-enabled de l'autre projet), puis : sudo nginx -t && sudo systemctl reload nginx
#
# Liens TP :
#   https://164.132.108.166/jeu
#   https://164.132.108.166/static/jeu/...  (assets)

# Page du jeu + sous-chemins éventuels
location /jeu {
    proxy_pass https://127.0.0.1:8444;
    proxy_ssl_verify off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
}

# Assets du module jeu uniquement (pas de conflit avec /static de l'autre site)
location /static/jeu/ {
    proxy_pass https://127.0.0.1:8444;
    proxy_ssl_verify off;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
